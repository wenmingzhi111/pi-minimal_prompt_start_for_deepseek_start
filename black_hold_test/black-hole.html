<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>黑洞可视化 - Black Hole</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: #000;
  }
  canvas {
    display: block;
  }
</style>
</head>
<body>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ================= Renderer / Camera / Scenes ================= */
const renderer = new THREE.WebGLRenderer({
  antialias: true,
  powerPreference: 'high-performance'
});
const MAX_PIXEL_RATIO = 2.0;
const MIN_PIXEL_RATIO = 1.0;
let pixelRatio = Math.min(window.devicePixelRatio || 1, MAX_PIXEL_RATIO);
renderer.setPixelRatio(pixelRatio);
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setClearColor(0x000000, 1.0);
document.body.appendChild(renderer.domElement);

const camera = new THREE.PerspectiveCamera(
  55, window.innerWidth / window.innerHeight, 0.05, 1200
);
camera.position.set(0, 7.0, 15.5);
camera.lookAt(0, 0, 0);

const bgScene = new THREE.Scene();   // 星空 / 星云背景，将被引力透镜后期扭曲
const fgScene = new THREE.Scene();   // 黑洞本体、光子球、吸积盘

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.enablePan = false;
controls.minDistance = 3.6;
controls.maxDistance = 55;
controls.minPolarAngle = 0.2;
controls.maxPolarAngle = Math.PI - 0.2;
controls.rotateSpeed = 0.7;
controls.zoomSpeed = 0.9;
controls.update();

/* ================= Shared GLSL noise ================= */
const NOISE_GLSL = `
float hash(vec3 p){
  return fract(sin(dot(p, vec3(127.1, 311.7, 74.7))) * 43758.5453123);
}

float noise(vec3 p){
  vec3 i = floor(p);
  vec3 f = fract(p);
  vec3 u = f * f * (3.0 - 2.0 * f);
  return mix(
    mix(
      mix(hash(i + vec3(0.0, 0.0, 0.0)), hash(i + vec3(1.0, 0.0, 0.0)), u.x),
      mix(hash(i + vec3(0.0, 1.0, 0.0)), hash(i + vec3(1.0, 1.0, 0.0)), u.x),
      u.y
    ),
    mix(
      mix(hash(i + vec3(0.0, 0.0, 1.0)), hash(i + vec3(1.0, 0.0, 1.0)), u.x),
      mix(hash(i + vec3(0.0, 1.0, 1.0)), hash(i + vec3(1.0, 1.0, 1.0)), u.x),
      u.y
    ),
    u.z
  );
}

float fbm(vec3 p){
  float v = 0.0;
  float a = 0.5;
  for(int i = 0; i < 4; i++){
    v += a * noise(p);
    p = p * 2.13 + vec3(11.31, 7.77, 3.13);
    a *= 0.55;
  }
  return v;
}
`;

/* ================= 背景：程序化星空穹顶 ================= */
const skyUniforms = { uTime: { value: 0 } };

const skyVertexShader = `
varying vec3 vDir;
void main(){
  vec4 worldPos = modelMatrix * vec4(position, 1.0);
  vDir = normalize(worldPos.xyz - cameraPosition);
  gl_Position = projectionMatrix * viewMatrix * worldPos;
}
`;

const skyFragmentShader = `
varying vec3 vDir;
uniform float uTime;
${NOISE_GLSL}

void main(){
  vec3 dir = normalize(vDir);
  vec3 col = vec3(0.004, 0.006, 0.016);

  // 深空星云
  float n1 = fbm(dir * 2.8 + vec3(0.0, uTime * 0.01, 0.0));
  float n2 = fbm(dir * 5.2 + vec3(2.3, 5.7, 9.1));
  float band = pow(1.0 - abs(dir.y), 3.0);
  col += vec3(0.020, 0.035, 0.080) * band * 0.55;
  col += vec3(0.045, 0.025, 0.110) * smoothstep(0.52, 0.92, n1) * 0.42;
  col += vec3(0.025, 0.060, 0.090) * smoothstep(0.58, 0.95, n2) * 0.36;

  // 密集微星（程序化，便于透镜拉伸成弧）
  vec3 gridPos = dir * 150.0;
  vec3 cell = floor(gridPos);
  float bright = hash(cell + 5.7);

  if(bright > 0.42){
    vec3 jitter = vec3(hash(cell + 1.3), hash(cell + 2.9), hash(cell + 4.5)) - 0.5;
    vec3 center = normalize(cell + 0.5 + jitter * 1.1);
    float d = length(dir - center);
    float starSize = mix(0.0012, 0.0055, bright);
    float m = 1.0 - smoothstep(starSize * 0.25, starSize, d);
    float tw = 0.65 + 0.35 * sin(uTime * (0.7 + bright * 2.3) + bright * 70.0);
    vec3 sc = mix(vec3(0.60, 0.70, 1.0), vec3(1.0, 0.90, 0.75), hash(cell + 9.1));
    col += sc * m * tw * smoothstep(0.42, 1.0, bright) * 1.1;
  }

  // 少量亮星
  float big = hash(cell + 13.3);
  if(big > 0.985){
    vec3 center = normalize(cell + 0.5);
    float d = length(dir - center);
    float m = 1.0 - smoothstep(0.0, 0.010, d);
    float tw = 0.70 + 0.30 * sin(uTime * 1.4 + big * 50.0);
    col += vec3(1.0, 0.95, 0.85) * m * tw;
  }

  gl_FragColor = vec4(col, 1.0);
}
`;

const skyMaterial = new THREE.ShaderMaterial({
  uniforms: skyUniforms,
  vertexShader: skyVertexShader,
  fragmentShader: skyFragmentShader,
  side: THREE.BackSide,
  depthWrite: false
});

const skyMesh = new THREE.Mesh(new THREE.SphereGeometry(450, 96, 64), skyMaterial);
skyMesh.frustumCulled = false;
skyMesh.renderOrder = -10;
bgScene.add(skyMesh);

/* ================= 背景：粒子星空 ================= */
const STAR_COUNT = 7000;
const starPositions = new Float32Array(STAR_COUNT * 3);
const starColors = new Float32Array(STAR_COUNT * 3);
const starSizes = new Float32Array(STAR_COUNT);
const starPhases = new Float32Array(STAR_COUNT);
const starSpeeds = new Float32Array(STAR_COUNT);

for(let i = 0; i < STAR_COUNT; i++){
  const u = Math.random();
  const v = Math.random();
  const theta = 2.0 * Math.PI * u;
  const phi = Math.acos(2.0 * v - 1.0);
  const radius = 110 + Math.random() * 140;

  starPositions[i * 3 + 0] = radius * Math.sin(phi) * Math.cos(theta);
  starPositions[i * 3 + 1] = radius * Math.sin(phi) * Math.sin(theta);
  starPositions[i * 3 + 2] = radius * Math.cos(phi);

  const kind = Math.random();
  if(kind < 0.65){
    starColors[i * 3 + 0] = 0.80 + Math.random() * 0.20;
    starColors[i * 3 + 1] = 0.85 + Math.random() * 0.15;
    starColors[i * 3 + 2] = 1.00;
  } else if(kind < 0.85){
    starColors[i * 3 + 0] = 1.00;
    starColors[i * 3 + 1] = 0.90 + Math.random() * 0.10;
    starColors[i * 3 + 2] = 0.72 + Math.random() * 0.20;
  } else {
    starColors[i * 3 + 0] = 1.00;
    starColors[i * 3 + 1] = 0.62 + Math.random() * 0.28;
    starColors[i * 3 + 2] = 0.45 + Math.random() * 0.25;
  }

  starSizes[i] = 0.6 + Math.pow(Math.random(), 2.0) * 1.8;
  starPhases[i] = Math.random() * Math.PI * 2.0;
  starSpeeds[i] = 0.5 + Math.random() * 3.0;
}

const starGeometry = new THREE.BufferGeometry();
starGeometry.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
starGeometry.setAttribute('aColor', new THREE.BufferAttribute(starColors, 3));
starGeometry.setAttribute('aSize', new THREE.BufferAttribute(starSizes, 1));
starGeometry.setAttribute('aPhase', new THREE.BufferAttribute(starPhases, 1));
starGeometry.setAttribute('aSpeed', new THREE.BufferAttribute(starSpeeds, 1));

const starUniforms = {
  uTime: { value: 0 },
  uPixelRatio: { value: renderer.getPixelRatio() }
};

const starVertexShader = `
attribute float aSize;
attribute vec3 aColor;
attribute float aPhase;
attribute float aSpeed;
uniform float uTime;
uniform float uPixelRatio;
varying vec3 vColor;
varying float vAlpha;

void main(){
  vec4 mv = modelViewMatrix * vec4(position, 1.0);
  float tw = 0.70 + 0.30 * sin(uTime * aSpeed + aPhase);
  gl_PointSize = aSize * uPixelRatio * (95.0 / max(1.0, -mv.z)) * tw;
  gl_Position = projectionMatrix * mv;
  vColor = aColor;
  vAlpha = 0.35 + 0.65 * tw;
}
`;

const starFragmentShader = `
varying vec3 vColor;
varying float vAlpha;

void main(){
  vec2 pc = gl_PointCoord - vec2(0.5);
  float d = length(pc);
  float a = 1.0 - smoothstep(0.05, 0.5, d);
  gl_FragColor = vec4(vColor, a * vAlpha);
}
`;

const starMaterial = new THREE.ShaderMaterial({
  uniforms: starUniforms,
  vertexShader: starVertexShader,
  fragmentShader: starFragmentShader,
  transparent: true,
  depthWrite: false,
  depthTest: false,
  blending: THREE.AdditiveBlending
});

const starPoints = new THREE.Points(starGeometry, starMaterial);
starPoints.frustumCulled = false;
starPoints.renderOrder = 10;
bgScene.add(starPoints);

/* ================= 引力透镜后期 ================= */
const bgRT = new THREE.WebGLRenderTarget(4, 4, {
  minFilter: THREE.LinearFilter,
  magFilter: THREE.LinearFilter,
  format: THREE.RGBAFormat,
  depthBuffer: true
});

function updateRenderTargetSize(){
  const size = renderer.getDrawingBufferSize(new THREE.Vector2());
  bgRT.setSize(size.x, size.y);
}
updateRenderTargetSize();

const lensUniforms = {
  tStars: { value: bgRT.texture },
  uCenter: { value: new THREE.Vector2(0.5, 0.5) },
  uAspect: { value: camera.aspect },
  uEinsteinR: { value: 0.12 },
  uHorizonR: { value: 0.055 },
  uTime: { value: 0 }
};

const lensVertexShader = `
varying vec2 vUv;
void main(){
  vUv = uv;
  gl_Position = vec4(position.xy, 0.0, 1.0);
}
`;

const lensFragmentShader = `
varying vec2 vUv;
uniform sampler2D tStars;
uniform vec2 uCenter;
uniform float uAspect;
uniform float uEinsteinR;
uniform float uHorizonR;
uniform float uTime;

void main(){
  vec2 d = vUv - uCenter;
  vec2 p = d * vec2(uAspect, 1.0);
  float r = length(p);
  float rE = uEinsteinR * (1.0 + 0.02 * sin(uTime * 0.85));

  vec3 col = vec3(0.0);

  if(r >= uHorizonR){
    // Schwarzschild 点质量透镜的逆映射：beta = theta - thetaE^2 / theta
    float beta = r - (rE * rE) / max(r, 1e-5);
    vec2 srcP = (p / max(r, 1e-5)) * beta;
    vec2 src = uCenter + vec2(srcP.x / uAspect, srcP.y);

    if(src.x >= 0.0 && src.x <= 1.0 && src.y >= 0.0 && src.y <= 1.0){
      col = texture2D(tStars, src).rgb;
    }

    // 爱因斯坦环微弱辉光
    float ring = exp(-pow((r - rE) * 9.0, 2.0));
    col += vec3(1.0, 0.80, 0.52) * ring * 0.20 * (0.82 + 0.18 * sin(uTime * 1.7));

    float halo = exp(-pow((r - rE) * 3.5, 2.0));
    col += vec3(0.80, 0.45, 0.20) * halo * 0.055;

    // 视界内部不允许背景光线到达
    float fade = smoothstep(uHorizonR, uHorizonR + 0.02, r);
    col *= mix(0.0, 1.0, fade);

    // 靠近爱因斯坦环的放大增亮
    float mag = 1.0 + 0.65 / (1.0 + abs(r - rE) * 16.0);
    col *= mag;
  }

  gl_FragColor = vec4(col, 1.0);
}
`;

const lensMaterial = new THREE.ShaderMaterial({
  uniforms: lensUniforms,
  vertexShader: lensVertexShader,
  fragmentShader: lensFragmentShader,
  depthTest: false,
  depthWrite: false
});

const lensScene = new THREE.Scene();
const lensQuad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), lensMaterial);
lensQuad.frustumCulled = false;
lensScene.add(lensQuad);
const lensCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);

/* ================= 前景：黑洞本体 ================= */
const bhGroup = new THREE.Group();
fgScene.add(bhGroup);

// 事件视界：纯黑球体，完全吸收光线
const blackSphere = new THREE.Mesh(
  new THREE.SphereGeometry(1.0, 128, 64),
  new THREE.MeshBasicMaterial({ color: 0x000000 })
);
bhGroup.add(blackSphere);

// 光子球：边缘发光
const photonUniforms = { uTime: { value: 0 }, uPulse: { value: 1 } };

const photonVertexShader = `
varying vec3 vNormal;
varying vec3 vView;
void main(){
  vNormal = normalize(normalMatrix * normal);
  vec4 mv = modelViewMatrix * vec4(position, 1.0);
  vView = -mv.xyz;
  gl_Position = projectionMatrix * mv;
}
`;

const photonFragmentShader = `
varying vec3 vNormal;
varying vec3 vView;
uniform float uTime;
uniform float uPulse;

void main(){
  vec3 N = normalize(vNormal);
  vec3 V = normalize(vView);
  float ndv = abs(dot(N, V));

  float rim = pow(1.0 - ndv, 3.0);
  float pulse = 0.82 + 0.18 * sin(uTime * 2.3);

  vec3 col = vec3(1.0, 0.72, 0.40) * rim * 1.7 * pulse * uPulse;
  col += vec3(1.0, 0.92, 0.75) * pow(rim, 7.0) * 2.0;

  float alpha = clamp(rim * 1.4, 0.0, 1.0);
  gl_FragColor = vec4(col, alpha);
}
`;

const photonMaterial = new THREE.ShaderMaterial({
  uniforms: photonUniforms,
  vertexShader: photonVertexShader,
  fragmentShader: photonFragmentShader,
  side: THREE.FrontSide,
  transparent: true,
  depthWrite: false,
  blending: THREE.AdditiveBlending
});

const photonSphere = new THREE.Mesh(new THREE.SphereGeometry(1.5, 96, 96), photonMaterial);
photonSphere.renderOrder = 2;
bhGroup.add(photonSphere);

// 外围极淡晕光
const haloUniforms = { uTime: { value: 0 }, uPulse: { value: 1 } };

const haloFragmentShader = `
varying vec3 vNormal;
varying vec3 vView;
uniform float uTime;
uniform float uPulse;

void main(){
  vec3 N = normalize(vNormal);
  vec3 V = normalize(vView);
  float ndv = abs(dot(N, V));
  float rim = pow(1.0 - ndv, 5.0);
  float pulse = 0.80 + 0.20 * sin(uTime * 1.9 + 1.1);
  vec3 col = vec3(0.90, 0.45, 0.18) * rim * 0.55 * pulse * uPulse;
  gl_FragColor = vec4(col, clamp(rim * 0.75, 0.0, 1.0));
}
`;

const haloMaterial = new THREE.ShaderMaterial({
  uniforms: haloUniforms,
  vertexShader: photonVertexShader,
  fragmentShader: haloFragmentShader,
  side: THREE.FrontSide,
  transparent: true,
  depthWrite: false,
  blending: THREE.AdditiveBlending
});

const haloSphere = new THREE.Mesh(new THREE.SphereGeometry(2.6, 64, 64), haloMaterial);
haloSphere.renderOrder = 0;
bhGroup.add(haloSphere);

/* ================= 吸积盘：纯 GLSL 动态等离子体 ================= */
const diskUniforms = {
  uTime: { value: 0 },
  uCameraPos: { value: new THREE.Vector3() },
  uInnerR: { value: 1.42 },
  uOuterR: { value: 8.5 },
  uPulse: { value: 1 }
};

const diskVertexShader = `
varying vec3 vWorldPos;
varying vec2 vLocalPos;
void main(){
  vLocalPos = position.xy;
  vec4 worldPos = modelMatrix * vec4(position, 1.0);
  vWorldPos = worldPos.xyz;
  gl_Position = projectionMatrix * viewMatrix * worldPos;
}
`;

const diskFragmentShader = `
varying vec3 vWorldPos;
varying vec2 vLocalPos;
uniform float uTime;
uniform vec3 uCameraPos;
uniform float uInnerR;
uniform float uOuterR;
uniform float uPulse;
${NOISE_GLSL}

void main(){
  float r = length(vLocalPos);
  if(r < uInnerR || r > uOuterR) discard;

  float phi = atan(vLocalPos.y, vLocalPos.x);

  // 开普勒式较差旋转：内圈快、外圈慢
  float omega = 2.1 / pow(max(r, 0.75), 1.5);
  float ang = phi + uTime * omega;
  vec2 q = vec2(cos(ang), sin(ang)) * r;

  // 湍流火焰噪声
  float n1 = fbm(vec3(q * 1.45, uTime * 0.20));
  float n2 = fbm(vec3(q * 2.80 + vec2(uTime * 0.11, -uTime * 0.07), uTime * 0.48));

  // 颜色：暗红 -> 亮橙 -> 黄白
  float t = clamp((r - uInnerR) / max(uOuterR - uInnerR, 0.001), 0.0, 1.0);
  vec3 deepRed = vec3(0.32, 0.015, 0.008);
  vec3 orange  = vec3(1.00, 0.360, 0.050);
  vec3 yellow  = vec3(1.00, 0.830, 0.300);
  vec3 white   = vec3(1.00, 0.960, 0.850);

  vec3 col = mix(deepRed, orange, smoothstep(0.0, 0.30, t));
  col = mix(col, yellow, smoothstep(0.30, 0.72, t));
  col = mix(col, white, smoothstep(0.72, 1.0, t));

  float filament = pow(n1, 1.65);
  float heat = smoothstep(0.16, 0.85, n2);
  float spiral = 0.55 + 0.45 * sin(ang * 6.0 - r * 1.7 + uTime * 1.6);
  float flicker = 0.85 + 0.15 * sin(uTime * (2.5 + n2 * 4.0) + n1 * 18.0);
  float intensity = (0.18 + 1.55 * filament) * (0.42 + 1.15 * heat) * spiral * flicker;

  // 径向渐隐
  float innerFade = smoothstep(uInnerR, uInnerR + 1.0, r);
  float outerFade = 1.0 - smoothstep(uOuterR - 2.8, uOuterR, r);
  float profile = innerFade * outerFade;

  // 多普勒增亮：旋转朝向观察者一侧更亮
  vec3 radialW = vWorldPos;
  float rr = length(radialW);
  vec3 rDir = radialW / max(rr, 0.0001);
  vec3 velocityDir = normalize(cross(vec3(0.0, 1.0, 0.0), rDir));
  vec3 viewDir = normalize(uCameraPos - vWorldPos);
  float mu = clamp(dot(velocityDir, viewDir), -1.0, 1.0);

  float beta = 0.72;
  float ratio = (1.0 - beta) / max(1.0 - beta * mu, 0.22);
  float doppler = 0.22 + 0.78 * pow(ratio, 2.2);

  col *= doppler;
  col = mix(
    col * vec3(1.05, 0.50, 0.32),
    col * vec3(1.18, 1.03, 0.90),
    smoothstep(0.20, 0.90, doppler)
  );

  // 内缘引力红移造成的变暗
  float gravDim = 0.35 + 0.65 * smoothstep(uInnerR, uInnerR + 1.7, r);
  col *= gravDim;
  col *= uPulse;

  // 内缘灼热亮边
  float rimGlow = exp(-pow((r - uInnerR) * 3.0, 2.0));
  col += vec3(1.0, 0.55, 0.22) * rimGlow * 0.40;

  // 背向观察者的一面更暗
  if(!gl_FrontFacing){
    col *= 0.45;
  }

  float finalIntensity = intensity * profile * 2.0;
  float alpha = clamp(finalIntensity * 1.1, 0.0, 1.0);
  gl_FragColor = vec4(col * finalIntensity, alpha);
}
`;

const diskMaterial = new THREE.ShaderMaterial({
  uniforms: diskUniforms,
  vertexShader: diskVertexShader,
  fragmentShader: diskFragmentShader,
  side: THREE.DoubleSide,
  transparent: true,
  depthWrite: false,
  blending: THREE.AdditiveBlending
});

const diskGeometry = new THREE.RingGeometry(1.35, 8.5, 512, 3);
const diskMesh = new THREE.Mesh(diskGeometry, diskMaterial);
diskMesh.rotation.x = -Math.PI / 2;   // 平放在 XZ 平面
diskMesh.renderOrder = 1;
bhGroup.add(diskMesh);

/* ================= 透镜投影参数更新 ================= */
const projectedCenter = new THREE.Vector3();

function worldRadiusToUV(worldRadius, distance){
  const halfFov = camera.fov * Math.PI / 360.0;
  const tanHalf = Math.tan(halfFov);
  const sinAngle = Math.min(worldRadius / distance, 0.999);
  return Math.tan(Math.asin(sinAngle)) / tanHalf * 0.5;
}

function updateLensProjection(scale){
  const dist = Math.max(camera.position.length(), 0.001);

  lensUniforms.uHorizonR.value = worldRadiusToUV(1.00 * scale, dist);
  lensUniforms.uEinsteinR.value = worldRadiusToUV(2.15 * scale, dist);
  lensUniforms.uAspect.value = camera.aspect;

  projectedCenter.set(0, 0, 0).project(camera);
  lensUniforms.uCenter.value.set(
    projectedCenter.x * 0.5 + 0.5,
    projectedCenter.y * 0.5 + 0.5
  );
}
updateLensProjection(1.0);

/* ================= Resize / 自适应渲染质量 ================= */
function applyPixelRatio(){
  renderer.setPixelRatio(pixelRatio);
  renderer.setSize(window.innerWidth, window.innerHeight);
  updateRenderTargetSize();
  starUniforms.uPixelRatio.value = renderer.getPixelRatio();
}

// 每 2 秒测一次帧率：低于 42fps 逐档降低分辨率，高于 57fps 逐档恢复，最高 2.0
let fpsFrames = 0;
let fpsElapsed = 0;

function updateQuality(delta){
  fpsFrames += 1;
  fpsElapsed += delta;
  if(fpsElapsed < 2.0) return;

  const fps = fpsFrames / fpsElapsed;
  fpsFrames = 0;
  fpsElapsed = 0;

  if(fps < 42 && pixelRatio > MIN_PIXEL_RATIO){
    pixelRatio = Math.max(MIN_PIXEL_RATIO, pixelRatio - 0.25);
    applyPixelRatio();
  } else if(fps > 57 && pixelRatio < MAX_PIXEL_RATIO){
    pixelRatio = Math.min(MAX_PIXEL_RATIO, pixelRatio + 0.25);
    applyPixelRatio();
  }
}

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();

  pixelRatio = Math.min(window.devicePixelRatio || 1, MAX_PIXEL_RATIO);
  applyPixelRatio();
  updateLensProjection(bhGroup.scale.x);
});

/* ================= 动画循环 ================= */
const clock = new THREE.Clock();

function animate(){
  requestAnimationFrame(animate);

  const delta = Math.min(clock.getDelta(), 0.1);
  const time = clock.getElapsedTime();
  controls.update(delta);

  // 黑洞整体呼吸 / 脉动
  const breathe = 1.0 + 0.015 * Math.sin(time * 1.25);
  bhGroup.scale.setScalar(breathe);

  skyUniforms.uTime.value = time;
  starUniforms.uTime.value = time;

  diskUniforms.uTime.value = time;
  diskUniforms.uCameraPos.value.copy(camera.position);
  diskUniforms.uInnerR.value = 1.42 + 0.07 * Math.sin(time * 1.45 + 0.7);
  diskUniforms.uPulse.value = 1.0 + 0.05 * Math.sin(time * 1.8 + 1.2);

  photonUniforms.uTime.value = time;
  photonUniforms.uPulse.value = 1.0 + 0.08 * Math.sin(time * 2.2);
  haloUniforms.uTime.value = time;
  haloUniforms.uPulse.value = 1.0 + 0.06 * Math.sin(time * 1.9 + 0.5);

  lensUniforms.uTime.value = time;
  updateLensProjection(breathe);

  // Pass 1: 把背景星空渲染到纹理
  renderer.setRenderTarget(bgRT);
  renderer.render(bgScene, camera);

  // Pass 2: 全屏引力透镜扭曲背景
  renderer.setRenderTarget(null);
  renderer.render(lensScene, lensCamera);

  // Pass 3: 前景黑洞与吸积盘叠加（只清深度，不清颜色）
  renderer.autoClear = false;
  renderer.clearDepth();
  renderer.render(fgScene, camera);
  renderer.autoClear = true;

  updateQuality(delta);
}

animate();
</script>
</body>
</html>
